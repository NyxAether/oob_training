[project]
name = "oob-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NyxAether", email = "contact.nyxhemera@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
oob-training = "oob_training:main"

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]


[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

